name: Build and release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-14
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install application and build dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.2
      - name: Check source and run desktop tests (Windows and macOS)
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v
      - name: Check source and run desktop tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Build, verify metadata, smoke-test, and package (Windows and macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: python tools/build_release.py --expected-version "$RELEASE_TAG"
      - name: Build, smoke-test, and package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a python tools/build_release.py --expected-version "$RELEASE_TAG"
      - name: Upload versioned download
        uses: actions/upload-artifact@v4
        with:
          name: LiteNetMonitor-${{ matrix.target }}
          path: dist/releases/*
          if-no-files-found: error

  release:
    name: Publish versioned release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: LiteNetMonitor-*
          merge-multiple: true
          path: release-assets
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - name: Publish downloads and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "LiteNetMonitor $RELEASE_TAG" --notes-file .github/RELEASE_NOTES.md release-assets/*
